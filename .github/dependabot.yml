version: 2
updates:
  # Workflows pin actions by tag or commit SHA; this is what moves the pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for every action: eleven separate PRs meant eleven images and eleven
    # deploy hooks for the same supply-chain bump.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # The dashboard's own dependencies. apps/web now exists with a lockfile, so Dependabot has a
  # manifest to read and no longer opens an empty "npm_and_yarn in /apps/web" PR.
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
