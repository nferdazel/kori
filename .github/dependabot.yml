version: 2
updates:
  # Workflows pin actions by tag or commit SHA; this is what moves the pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for every action: eleven separate PRs meant eleven images and eleven
    # deploy hooks for the same supply-chain bump.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # No npm ecosystem entry: apps/web does not exist in this tree, so Dependabot found no
  # manifest and opened a failing "npm_and_yarn in /apps/web" PR on every run. Add it back
  # together with the dashboard and its lockfile.
