# class: B
name: Release

# A tag is what makes a version a release, and this workflow is the only thing that
# turns one into a GitHub Release. It runs on the tag, never on a push to main: kori
# pushes to main only when a change is substantial (a push spends Actions minutes),
# so a release must not be a side effect of the daily push.
#
# The Release body is the version's own CHANGELOG section, not a hand-typed summary,
# so the page cannot drift from the file this repo already keeps. The job is
# idempotent: re-running it on a tag that already has a Release updates the notes
# instead of failing, which is what a fixed typo in a released section needs.
#
# Golden CI/CD contract: timeout-minutes, a cached toolchain, and no GitHub context
# expression interpolated into a shell script — values travel through env.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release: notes from the CHANGELOG"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The version is read from VERSION, not echoed from the tag, and the two must
      # agree: a tag that names a version the repository does not declare is a
      # mis-tagged commit and the release stops here.
      - name: Check the tag matches VERSION
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(tr -d ' \n\r' <VERSION)"
          if [ "v${version}" != "$REF_NAME" ]; then
            echo "tag $REF_NAME does not match VERSION v${version}" >&2
            exit 1
          fi
          echo "tag $REF_NAME matches VERSION v${version}"

      # The section between "## [x.y.z]" and the next "## [" heading, verbatim.
      # An empty or missing section is a refusal: a Release page that says nothing
      # is worse than a Release page that has to be written by hand.
      - name: Extract the section from CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${REF_NAME#v}"
          awk -v want="$version" '
            $0 ~ "^## \\[" want "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version; write it before tagging" >&2
            exit 1
          fi
          echo "notes: $(wc -l <"$RUNNER_TEMP/notes.md" | tr -d ' ') lines"

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -eu
          # `gh release view` is a single lookup, not a poll: the tag is this run's
          # own trigger, so there is nothing to wait for.
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" --notes-file "$NOTES"
            echo "Release $REF_NAME updated from CHANGELOG.md"
          else
            gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" \
              --notes-file "$NOTES"
            echo "Release $REF_NAME created from CHANGELOG.md"
          fi
