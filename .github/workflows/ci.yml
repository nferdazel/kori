name: CI

# Build in GitHub, pull on the host. image-api builds the container on every PR and pushes
# ghcr.io/nferdazel/kori-api:sha-<7> plus :main on main, keyless-signs the digest and labels
# the revision the host compares against. qouver1 never builds: it pulls that tag through
# ops/scripts/deploy-vps.sh. No job here calls a webhook; the deploy trigger is the repo push
# webhook, the same path the other apps use.
#
# Golden CI/CD contract, applied here: every job has timeout-minutes: 15, every job caches its
# package manager, and no GitHub context expression is interpolated into a shell script — the
# values travel through env: and are read as shell variables.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits; with contents:read alone that call is 403
  # and the job dies before scanning anything.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: a cancel between "push image" and "deploy" leaves the host
  # pulling an image whose build was killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: "2.4.2"
  SHELLCHECK_VERSION: "v0.10.0"

jobs:

  # Golden CI/CD contract: the same rules the server repo enforces, run here so drift fails
  # this repo's own build instead of waiting for a manual audit. The script is qouver's
  # ops/scripts/contract-check.sh with one data entry added to its repo_exempt table: kori's
  # dashboard is embedded in the api binary, so the C3 quadlet rule cannot apply. Port any other
  # fix back to qouver and copy it out again.
  contract:
    name: "Contract: golden CI/CD rules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Contract: check this repo"
        run: ./ops/scripts/contract-check.sh .

  nim:
    name: "Nim: check + tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Nim toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.nimble
            ~/.cache/nim
          key: nim-${{ env.NIM_VERSION }}-${{ hashFiles('kori.nimble') }}
          restore-keys: |
            nim-${{ env.NIM_VERSION }}-

      - name: Install Nim
        env:
          NIM_VERSION: ${{ env.NIM_VERSION }}
        run: |
          set -eu
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          mkdir -p "$HOME/nim"
          tar -xJf /tmp/nim.tar.xz -C "$HOME/nim" --strip-components=1
          echo "$HOME/nim/bin" >> "$GITHUB_PATH"

      # No dashboard build here: apps/web/dist is committed, and the binary embeds it. What this
      # job proves is that the committed embed matches that committed dist, so a stale
      # static_files.nim cannot ship a dashboard nobody rebuilt. node setup stays out of this job;
      # image-web is the job that rebuilds dist from source.
      - name: Install dependencies
        run: nimble install -d -y

      # tools/gen-static.sh is deterministic (sorted, no timestamps, no absolute paths), so a
      # fresh regeneration on a clean tree must produce the committed bytes. A hand edit, a dist
      # change without a regen, or a regen without the dist all land here as a diff.
      - name: Static embed drift
        run: |
          set -eu
          sh tools/gen-static.sh apps/web/dist apps/api/src/generated/static_files.nim
          git diff --exit-code -- apps/api/src/generated/static_files.nim

      # VERSION is the only hand-written version number. This fails when VERSION, kori.nimble,
      # the generated module or the newest CHANGELOG heading disagree, so a hand edit in one
      # place cannot reach main unnoticed. It is the same check ./task nim runs locally.
      - name: Version sync
        run: ./task version-check

      - name: Check
        run: nim check --hints:off apps/api/src/kori.nim

      - name: Tests
        run: nimble test -y

      # The acceptance harness is the only thing that proves the router end to end, so it is a
      # gate and not an optional job. The release-mode binary must compile even when the harness
      # is absent: -d:release is where the compiler turns off runtime checks, so that step stands
      # on its own. The suite itself is fail-closed — a harness that cannot run proves nothing.
      - name: Build release binary
        run: nim c -d:release --mm:orc --threads:on --hints:off -o:apps/api/src/kori apps/api/src/kori.nim

      - name: Acceptance suite
        env:
          KORI_BIN: ./apps/api/src/kori
        run: |
          set -eu
          [ -f acceptance/run-all.sh ] || {
            echo "acceptance/run-all.sh is missing from the tree; the acceptance gate cannot run" >&2
            exit 1
          }
          sh acceptance/run-all.sh

  # One required status for branch protection, and the only door to publication: the image job
  # below needs this job, so a commit whose quality gates are red can never become a pullable
  # tag. Results travel through env, never interpolated into a shell script.
  gate:
    name: Gate
    if: always()
    needs: [contract, nim, security, ops]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_CONTRACT: ${{ needs.contract.result }}
      R_NIM: ${{ needs.nim.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_OPS: ${{ needs.ops.result }}
    steps:
      - name: Require every job to be green
        shell: bash
        run: |
          fail=0
          for r in "$R_CONTRACT" "$R_NIM" "$R_SECURITY" "$R_OPS"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          exit "$fail"

  # Build always, push only on main: a Dockerfile that no longer compiles is a red PR instead of
  # a red production deploy at night. The host never builds — it pulls this tag and checks the
  # revision label against the commit it checked out.
  #
  # No `if:` filter here: a broken image must report red rather than disappear from the run.
  # The `needs: [gate]` is the publication gate, not a skip.
  image-api:
    name: "Image: api"
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, this job only
    steps:
      # This job holds packages: write and id-token: write, so its actions are pinned to a commit:
      # a retagged major would otherwise run whatever the tag points at with those permissions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ${GITHUB_SHA::7} is bash syntax and inside `with:` there is no shell, so buildx receives
      # it literally and the tag is invalid. printf '%.7s' also matches the host's `cut -c1-7`
      # exactly, which `rev-parse --short` does not.
      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NIM_SHA256 has no default in apps/api/Dockerfile on purpose: the build must fail here,
      # loudly, rather than trust whatever nim-lang.org serves today. The value was read once and
      # is bumped in review, never automatically.
      #   NIM_SHA256   https://nim-lang.org/download/nim-2.4.2-linux_x64.tar.xz.sha256
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NIM_SHA256=0ee5b16e81852a956d4fddb4aa44b5958c645c992132fa43be45f489573ee325
            KORI_REVISION=${{ steps.short.outputs.sha7 }}
          tags: |
            ghcr.io/nferdazel/kori-api:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/kori-api:main
          # The host compares this label with the commit it reset to before it rotates :local.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/kori-api@${DIGEST}"

  # C3 of the shared contract says a repo with apps/web/ needs its own web job. kori has no
  # separate web container to publish: the built dashboard is embedded into the single kori-api
  # binary (tools/gen-static.sh), so the contract's "quadlet on 127.0.0.1:<port>:8080" stays a
  # warning here by design. This job is that web job, honest about what it proves: the committed
  # dist is a fresh `vite build`, so what image-api embeds is what the source says, and the
  # lockfile passes an audit. Nothing is pushed from here.
  image-web:
    name: "Web: build and dist drift check"
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The version comes from packageManager in apps/web/package.json, so the pin lives in one
      # place and this step never drifts from what a laptop runs. v6 is the line that reads a
      # pnpm 12 pin; v4 predates it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # packageManager lives in apps/web, not at the repo root: without this the action
          # looks for a root package.json, finds none and fails with "No pnpm version is
          # specified" before node or pnpm ever runs.
          package_json_file: apps/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The dependency CVE gate for the node stack. Every repo here is public; a known-bad
      # transitive package is as public as a leaked token.
      - name: Audit the lockfile
        working-directory: apps/web
        run: pnpm audit --audit-level=high

      - name: Build the dashboard
        working-directory: apps/web
        run: pnpm run build

      # dist is committed because `nim c` embeds it and the container never runs node. A stale
      # dist would ship an old dashboard silently, so a diff here is a red build, not a note.
      - name: Committed dist must match a fresh build
        run: git diff --exit-code -- apps/web/dist

  security:
    name: "Security: secrets scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every repository here is public. A leaked token is public the moment it is pushed, so the
      # scan walks the whole history and not just the diff. The wrapper action derives a
      # `before..after` range from the push event, and a rewritten main leaves that range
      # unresolvable, so the binary is called directly instead.
      - name: Install gitleaks
        run: |
          set -eu
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks git --redact --no-banner --verbose --exit-code 1 .

  ops:
    name: "Ops: shellcheck + deploy/smoke dry runs"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Nothing else in this pipeline reads ops/scripts. Without this job an edit to the ref guard
      # or the rollback branch lands on main with only `bash -n` behind it, and the next deploy is
      # the first time the change runs.
      - name: Cache shellcheck
        uses: actions/cache@v6
        with:
          path: ~/.cache/kori-shellcheck
          key: shellcheck-${{ env.SHELLCHECK_VERSION }}

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -eu
          DEST="$HOME/.cache/kori-shellcheck"
          mkdir -p "$DEST"
          if [ -x "$DEST/shellcheck" ]; then
            echo "shellcheck restored from cache"
          else
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
            install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$DEST/shellcheck"
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/shellcheck" --version

      # -S warning on purpose: SC2015 (info) fires on the `[ test ] && pass || fail` idiom the
      # harnesses use throughout, and `pass` cannot fail, so the pattern is not a bug there.
      - name: Shellcheck
        run: shellcheck -S warning -x ops/scripts/*.sh tools/gen-static.sh tests/dryrun-*.sh

      - name: "Deploy dry run (ref guard, lock, retag, rollback)"
        run: bash tests/dryrun-deploy.sh

      - name: "Smoke dry run (edge matrix, bearer gate)"
        run: bash tests/dryrun-smoke.sh

      # The first deploy is gated on host facts nobody can see from a laptop: port, build slot,
      # disk, lingering, the Quadlet generator, the Caddy module set. Every FAIL branch is driven
      # by the harness, so the check cannot rot into "always green".
      - name: "Preflight dry run (host gate branches)"
        run: bash tests/dryrun-preflight.sh
