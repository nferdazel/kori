name: CI

# Build in GitHub, pull on the host. image-api builds the container on every PR and pushes
# ghcr.io/nferdazel/kori-api:sha-<7> plus :main on main, keyless-signs the digest and labels
# the revision the host compares against. qouver1 never builds: it pulls that tag through
# ops/scripts/deploy-vps.sh. No job here calls a webhook; the deploy trigger is the repo push
# webhook, the same path the other apps use.
#
# Golden CI/CD contract, applied here: every job has timeout-minutes: 15, every job caches its
# package manager, and no GitHub context expression is interpolated into a shell script — the
# values travel through env: and are read as shell variables.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits; with contents:read alone that call is 403
  # and the job dies before scanning anything.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: a cancel between "push image" and "deploy" leaves the host
  # pulling an image whose build was killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: "2.4.2"
  SHELLCHECK_VERSION: "v0.10.0"

jobs:

  # Golden CI/CD contract: the same rules the server repo enforces, run here so drift fails
  # this repo's own build instead of waiting for a manual audit. The script is a byte-identical
  # copy of qouver's ops/scripts/contract-check.sh; fix it there and copy it out again.
  contract:
    name: "Contract: golden CI/CD rules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Contract: check this repo"
        run: ./ops/scripts/contract-check.sh .

  nim:
    name: "Nim: check + tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Nim toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.nimble
            ~/.cache/nim
          key: nim-${{ env.NIM_VERSION }}-${{ hashFiles('kori.nimble') }}
          restore-keys: |
            nim-${{ env.NIM_VERSION }}-

      - name: Install Nim
        env:
          NIM_VERSION: ${{ env.NIM_VERSION }}
        run: |
          set -eu
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          mkdir -p "$HOME/nim"
          tar -xJf /tmp/nim.tar.xz -C "$HOME/nim" --strip-components=1
          echo "$HOME/nim/bin" >> "$GITHUB_PATH"

      # No dashboard build here: apps/web does not exist in this tree yet, so the embed step and
      # its node setup were removed rather than left pointing at a missing lockfile. Restore both
      # (and the Dockerfile's node stage) when the vite dashboard lands.
      - name: Install dependencies
        run: nimble install -d -y

      - name: Check
        run: nim check --hints:off apps/api/src/kori.nim

      - name: Tests
        run: nimble test -y

      # The acceptance harness from the scope folder runs against a real binary. It is the only
      # thing that proves the router, so it is a gate and not an optional job.
      - name: Acceptance harness
        env:
          KORI_BIN: ./apps/api/src/kori
        run: |
          set -eu
          nim c -d:release --mm:orc --threads:on --hints:off -o:"$KORI_BIN" apps/api/src/kori.nim
          sh acceptance/selftest.sh

  # One required status for branch protection, and the only door to publication: the image job
  # below needs this job, so a commit whose quality gates are red can never become a pullable
  # tag. Results travel through env, never interpolated into a shell script.
  gate:
    name: Gate
    if: always()
    needs: [contract, nim, security, ops]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_CONTRACT: ${{ needs.contract.result }}
      R_NIM: ${{ needs.nim.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_OPS: ${{ needs.ops.result }}
    steps:
      - name: Require every job to be green
        shell: bash
        run: |
          fail=0
          for r in "$R_CONTRACT" "$R_NIM" "$R_SECURITY" "$R_OPS"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          exit "$fail"

  # Build always, push only on main: a Dockerfile that no longer compiles is a red PR instead of
  # a red production deploy at night. The host never builds — it pulls this tag and checks the
  # revision label against the commit it checked out.
  #
  # No `if:` filter here: a broken image must report red rather than disappear from the run.
  # The `needs: [gate]` is the publication gate, not a skip.
  image-api:
    name: "Image: api"
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, this job only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ${GITHUB_SHA::7} is bash syntax and inside `with:` there is no shell, so buildx receives
      # it literally and the tag is invalid. printf '%.7s' also matches the host's `cut -c1-7`
      # exactly, which `rev-parse --short` does not.
      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NIM_SHA256 has no default in apps/api/Dockerfile on purpose: the build must fail here,
      # loudly, rather than trust whatever nim-lang.org serves today. The value was read once and
      # is bumped in review, never automatically.
      #   NIM_SHA256   https://nim-lang.org/download/nim-2.4.2-linux_x64.tar.xz.sha256
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NIM_SHA256=0ee5b16e81852a956d4fddb4aa44b5958c645c992132fa43be45f489573ee325
          tags: |
            ghcr.io/nferdazel/kori-api:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/kori-api:main
          # The host compares this label with the commit it reset to before it rotates :local.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/kori-api@${DIGEST}"

  security:
    name: "Security: secrets scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every repository here is public. A leaked token is public the moment it is pushed, so the
      # scan runs on the full history and not just the diff.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ops:
    name: "Ops: shellcheck + deploy/smoke dry runs"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Nothing else in this pipeline reads ops/scripts. Without this job an edit to the ref guard
      # or the rollback branch lands on main with only `bash -n` behind it, and the next deploy is
      # the first time the change runs.
      - name: Cache shellcheck
        uses: actions/cache@v6
        with:
          path: ~/.cache/kori-shellcheck
          key: shellcheck-${{ env.SHELLCHECK_VERSION }}

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -eu
          DEST="$HOME/.cache/kori-shellcheck"
          mkdir -p "$DEST"
          if [ -x "$DEST/shellcheck" ]; then
            echo "shellcheck restored from cache"
          else
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
            install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$DEST/shellcheck"
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/shellcheck" --version

      # -S warning on purpose: SC2015 (info) fires on the `[ test ] && pass || fail` idiom the
      # harnesses use throughout, and `pass` cannot fail, so the pattern is not a bug there.
      - name: Shellcheck
        run: shellcheck -S warning -x ops/scripts/*.sh tools/gen-static.sh tests/dryrun-*.sh

      - name: "Deploy dry run (ref guard, lock, retag, rollback)"
        run: bash tests/dryrun-deploy.sh

      - name: "Smoke dry run (edge matrix, bearer gate)"
        run: bash tests/dryrun-smoke.sh

      # The first deploy is gated on host facts nobody can see from a laptop: port, build slot,
      # disk, lingering, the Quadlet generator, the Caddy module set. Every FAIL branch is driven
      # by the harness, so the check cannot rot into "always green".
      - name: "Preflight dry run (host gate branches)"
        run: bash tests/dryrun-preflight.sh
